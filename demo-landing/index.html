<!doctype html>
<html lang="es" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Fuego & Harina • Bodegón & Horno a Leña (Demo Landing)</title>
    <meta name="description" content="Cocina de autor, fuegos y pizzas de masa madre al horno a leña. Reservá tu mesa o pedí directo a nuestro WhatsApp sin intermediarios." />
    
    <!-- Google Fonts: Fraunces (Warm Artisanal Culinary Serif) + Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400;1,9..144,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Fraunces"', 'Georgia', 'serif'],
              sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            },
            colors: {
              ember: {
                50: '#fff7ed',
                100: '#ffedd5',
                200: '#fed7aa',
                300: '#fdba74',
                400: '#fb923c',
                500: '#f97316',
                600: '#ea580c',
                700: '#c2410c',
                800: '#9a3412',
                900: '#7c2d12',
              },
              wood: {
                dark: '#0E0C0A',
                card: '#181412',
                cardhover: '#221C18',
                border: '#2C231E'
              }
            },
            boxShadow: {
              'ember-glow': '0 0 30px -5px rgba(249, 115, 22, 0.25)',
              'food-card': '0 10px 30px -10px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.04)'
            }
          }
        }
      }
    </script>
    <style>
      html, body {
        overflow-x: hidden;
        max-width: 100vw;
      }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.01em;
      }
      .font-serif-culinary {
        font-family: 'Fraunces', Georgia, serif;
      }
      /* Custom minimal scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #392b23;
        border-radius: 9999px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #2a201a;
      }
    </style>
  </head>
  <body class="bg-[#0E0C0A] text-neutral-100 min-h-screen flex flex-col selection:bg-orange-500 selection:text-white transition-colors duration-200 overflow-x-hidden">
    <div id="app" class="flex-grow flex flex-col w-full overflow-x-hidden min-w-0"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
