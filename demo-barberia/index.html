<!doctype html>
<html lang="es" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>La Hermandad Barber Club • Sistema de Turnos Online</title>
    <meta name="description" content="Barbería tradicional y cortes contemporáneos. Reservá tu turno online en 30 segundos con tu barbero de confianza." />
    
    <!-- Google Fonts: Bebas Neue (Bold Display) + Plus Jakarta Sans + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              display: ['"Bebas Neue"', 'sans-serif'],
              sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              amber: {
                50: '#fffbeb',
                100: '#fef3c7',
                200: '#fde68a',
                300: '#fcd34d',
                400: '#fbbf24',
                500: '#f59e0b',
                600: '#d97706',
                700: '#b45309',
                800: '#92400e',
                900: '#78350f',
                950: '#451a03',
              },
              barber: {
                dark: '#08090C',
                card: '#101218',
                cardhover: '#151821',
                border: '#1F232F',
                gold: '#F59E0B',
                golddim: '#D97706'
              }
            },
            boxShadow: {
              'amber-glow': '0 0 25px -5px rgba(245, 158, 11, 0.25)',
              'barber-card': '0 10px 30px -10px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05)',
              'barber-selected': '0 0 0 2px #f59e0b, 0 10px 25px -5px rgba(245, 158, 11, 0.3)'
            }
          }
        }
      }
    </script>
    <style>
      html, body {
        overflow-x: hidden;
        max-width: 100vw;
      }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.01em;
      }
      .font-display {
        font-family: 'Bebas Neue', sans-serif;
        letter-spacing: 0.04em;
      }
      /* Custom minimal scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #2a2e3d;
        border-radius: 9999px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #232734;
      }
      .barber-pole-stripes {
        background: repeating-linear-gradient(
          -45deg,
          #dc2626,
          #dc2626 8px,
          #ffffff 8px,
          #ffffff 16px,
          #2563eb 16px,
          #2563eb 24px,
          #ffffff 24px,
          #ffffff 32px
        );
      }
    </style>
  </head>
  <body class="bg-[#08090C] text-neutral-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-neutral-950 transition-colors duration-200 overflow-x-hidden">
    <div id="app" class="flex-grow flex flex-col w-full overflow-x-hidden min-w-0"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
