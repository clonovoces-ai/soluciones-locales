<!doctype html>
<html lang="es" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Soluciones Digitales para Comercios • Web Padre</title>
    <meta name="description" content="Tu negocio en internet en 24hs sin intermediarios ni comisiones abusivas. Catálogos digitales, webs y software de caja para comercios locales." />
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN con Dark Mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Custom minimal scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e5e5e5;
        border-radius: 9999px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #262626;
      }
    </style>
  </head>
  <body class="bg-[#FAFAFA] dark:bg-[#0E1015] text-neutral-900 dark:text-neutral-100 min-h-screen flex flex-col selection:bg-neutral-900 dark:selection:bg-neutral-100 selection:text-white dark:selection:text-neutral-900 transition-colors duration-200">
    <div id="app" class="flex-grow flex flex-col"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
