<!doctype html>
<html lang="es" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Soluciones Digitales para Comercios Locales</title>
    <meta name="description" content="Tu negocio en internet en 24hs sin intermediarios ni comisiones abusivas. Catálogos digitales, webs y software de caja para comercios locales." />
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN con Dark Mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            },
            colors: {
              hub: {
                dark: '#0A0D14',
                card: '#121622',
                cardhover: '#181E2E',
                border: '#1E2538'
              }
            },
            boxShadow: {
              'hub-glow': '0 0 35px -5px rgba(59, 130, 246, 0.25)',
              'emerald-glow': '0 0 30px -5px rgba(16, 185, 129, 0.25)',
            }
          }
        }
      }
    </script>
    <style>
      html, body {
        overflow-x: hidden;
        max-width: 100vw;
      }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.01em;
      }
      /* Custom minimal scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #273046;
        border-radius: 9999px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #1e2538;
      }
    </style>
  </head>
  <body class="bg-[#0A0D14] text-neutral-100 min-h-screen flex flex-col selection:bg-blue-600 selection:text-white transition-colors duration-200 overflow-x-hidden w-full">
    <div id="app" class="flex-grow flex flex-col w-full overflow-x-hidden min-w-0"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
